<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مِعْمَارُ الوَحْيِ | MIMAR AL-WAHY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@500;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #070b12;
      --card-bg: rgba(13, 20, 36, 0.92);
      --gold-primary: #e5c158;
      --gold-light: #ffe44d;
      --gold-dark: #997819;
      --border-gold: rgba(229, 193, 88, 0.35);
      --text-light: #e6edf3;
      --text-dim: #9daec8;
      --accent-blue: #16243d;
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Amiri', 'Scheherazade New', serif;
      line-height: 1.8;
      background-image: radial-gradient(circle at 50% 0%, #111d33 0%, var(--bg-dark) 70%);
      min-height: 100vh;
    }

    /* Hero Header */
    .hero-header {
      position: relative;
      background: linear-gradient(180deg, rgba(7, 11, 18, 0.6) 0%, var(--bg-dark) 100%),
                  url('https://images.unsplash.com/photo-1519817650390-64a93db51149?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
      padding: 40px 20px 30px;
      text-align: center;
      border-bottom: 2px solid var(--gold-primary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .hero-title-box {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      background: rgba(7, 11, 18, 0.75);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 0 20px rgba(229, 193, 88, 0.1);
    }

    .main-title {
      font-family: 'Reem Kufi', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      color: var(--gold-primary);
      text-shadow: 0 0 15px rgba(229, 193, 88, 0.4);
      margin-bottom: 5px;
    }

    .sub-title-latin {
      font-family: sans-serif;
      letter-spacing: 3px;
      color: var(--gold-light);
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 1.3rem;
      color: #ffffff;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .author-tag {
      font-size: 1.1rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border-gold);
      display: inline-block;
      padding-top: 8px;
      margin-top: 5px;
    }

    .author-name {
      color: var(--gold-light);
      font-weight: bold;
      font-size: 1.4rem;
    }

    /* Platform Info Box */
    .info-banner {
      max-width: 950px;
      margin: 25px auto 10px;
      background: rgba(16, 28, 48, 0.85);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .info-banner h3 {
      color: var(--gold-primary);
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 12px;
    }

    .info-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
    }

    .info-list i {
      color: var(--gold-primary);
      font-size: 1rem;
    }

    /* Layout Structure */
    .container {
      max-width: 1280px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Sidebar - Gate Map */
    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius);
      padding: 20px;
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .sidebar-title {
      font-family: 'Reem Kufi', sans-serif;
      color: var(--gold-primary);
      font-size: 1.3rem;
      border-bottom: 1px solid var(--border-gold);
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gate-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gate-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(229, 193, 88, 0.15);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gate-item:hover, .gate-item.active {
      background: rgba(229, 193, 88, 0.15);
      border-color: var(--gold-primary);
      color: var(--gold-light);
    }

    /* Main Content Area */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .gate-header-banner {
      background: linear-gradient(90deg, rgba(229, 193, 88, 0.2) 0%, rgba(13, 20, 36, 0.8) 100%);
      border-right: 4px solid var(--gold-primary);
      padding: 15px 20px;
      border-radius: 8px;
    }

    .gate-header-banner h2 {
      font-family: 'Reem Kufi', sans-serif;
      color: var(--gold-light);
      font-size: 1.6rem;
    }

    .axis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .axis-card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius);
      padding: 20px;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .axis-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(229, 193, 88, 0.15);
      border-color: var(--gold-primary);
    }

    .axis-title {
      font-size: 1.3rem;
      color: var(--gold-primary);
      margin-bottom: 10px;
      font-weight: bold;
      border-bottom: 1px dotted var(--border-gold);
      padding-bottom: 5px;
    }

    .axis-desc {
      font-size: 0.98rem;
      color: var(--text-light);
      margin-bottom: 15px;
    }

    .sub-sections {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sub-btn {
      background: rgba(229, 193, 88, 0.08);
      border: 1px solid rgba(229, 193, 88, 0.2);
      color: var(--text-light);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition);
    }

    .sub-btn:hover {
      background: var(--gold-primary);
      color: #000;
      font-weight: bold;
    }

    /* Footer Section */
    .footer {
      background: #04060a;
      border-top: 2px solid var(--gold-primary);
      padding: 40px 20px 20px;
      text-align: center;
      margin-top: 50px;
    }

    .quran-verse {
      font-family: 'Amiri', serif;
      font-size: 1.8rem;
      color: var(--gold-light);
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(259, 228, 77, 0.3);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .social-btn {
      padding: 8px 20px;
      border-radius: 25px;
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      transition: var(--transition);
    }

    .btn-yt { background: #cc181e; }
    .btn-tt { background: #000000; border: 1px solid var(--border-gold); }
    .btn-fb { background: #3b5998; }
    .btn-ig { background: #c13584; }

    .social-btn:hover { transform: scale(1.05); }

    .contact-info {
      color: var(--gold-primary);
      font-size: 1.1rem;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .copyright {
      color: var(--text-dim);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Hero Header -->
  <header class="hero-header">
    <div class="hero-title-box">
      <h1 class="main-title">( مِعْمَارُ الوَحْيِ )</h1>
      <div class="sub-title-latin">MIMAR AL-WAHY</div>
      <div class="tagline">عَلَى بَصِيرَةِ العَقْلِ وَهِدَايَةِ الإِسْلَامِ – لِنَحْيَا كِرَاماً</div>
      <div class="author-tag">
        الأُسْتَاذُ البَاحِثُ: <span class="author-name">رَمَاضْنَة عبد العزيز</span> – دِرَاسَاتٌ إِسْلَامِيَّةٌ عُلْيَا – أُسْتَاذٌ مُكَوِّنٌ لِلتَّعْلِيمِ الثَّانَوِيِّ
      </div>
    </div>

    <!-- Info Banner -->
    <div class="info-banner">
      <h3>| منصة إسلامية فكرية لتقرير اليقين بثوابت وتعاليم الدين الإسلامي |</h3>
      <ul class="info-list">
        <li><i class="fa-solid fa-circle-check"></i> 1️⃣ نقد منهجي صارم وإجابات علمية موثوقة للشبهات المپثارة.</li>
        <li><i class="fa-solid fa-circle-check"></i> 2️⃣ روائع الفيديوهات والكتب والأبحاث الجامعية والمقالات الفكرية.</li>
        <li><i class="fa-solid fa-circle-check"></i> 3️⃣ روابط سهلة لمصادر المعرفة والتثقيف الإيجابي.</li>
      </ul>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    
    <!-- Sidebar: Gate Map -->
    <aside class="sidebar">
      <div class="sidebar-title">
        <i class="fa-solid fa-sitemap"></i> خريطة البوابات
      </div>
      <ul class="gate-menu">
        <li class="gate-item active">🔵 أولاً - العُرْوَةُ الوُثْقَى <i class="fa-solid fa-chevron-left"></i></li>
        <li class="gate-item">🔴 ثانياً - تَهَافُتُ الفَلَاسِفَةِ <i class="fa-solid fa-chevron-left"></i></li>
        <li class="gate-item">🟢 ثالثاً - الإِنْسَانُ يَبْحَثُ عَنِ المَعْنَى <i class="fa-solid fa-chevron-left"></i></li>
        <li class="gate-item">🟡 رابعاً - الصِّرَاطُ المُنْتَهَى <i class="fa-solid fa-chevron-left"></i></li>
        <li class="gate-item">🟣 خامساً - رِجَالٌ وَحَضَارَاتٌ <i class="fa-solid fa-chevron-left"></i></li>
        <li class="gate-item">🟠 سادساً - بِالإِسْلَامِ نَحْيَا <i class="fa-solid fa-chevron-left"></i></li>
        <li class="gate-item">🌸 سابعاً - مِعْمَارُ الأُسْرَةِ <i class="fa-solid fa-chevron-left"></i></li>
        <li class="gate-item">⚪ ثامناً - خُطَّةُ النَّصْرِ <i class="fa-solid fa-chevron-left"></i></li>
      </ul>
    </aside>

    <!-- Content Area -->
    <main class="content-area">
      
      <div class="gate-header-banner">
        <h2>المِعْمَارُ المَعْرِفِيُّ لِلْمَنَصَّةِ – خَرِيطَةُ البَوَّابَاتِ وَالمَحَاوِرِ</h2>
        <p style="color: var(--text-dim);">أولاً - البَوَّابَةُ الأُولَى: العُرْوَةُ الوُثْقَى (الأَكْمَلُ وَالحَضَارَةُ)</p>
      </div>

      <div class="axis-grid">
        
        <!-- Axis 1 -->
        <div class="axis-card">
          <div>
            <div class="axis-title">المحور الأول: رَوَاسِخُ الإِيمَانِ</div>
            <div class="axis-desc">
              1️⃣ تأصيل برهاني جرفاني لمرتكزات اليقين وتثبيت أصول اعتقاد أهل السنة والجماعة.<br>
              2️⃣ مواجهة علمية لوساوس الشك وتحديات السيولة الفكرية في زمن العصر الرقمي الصعب.
            </div>
          </div>
          <div class="sub-sections">
            <a href="#" class="sub-btn">مقالات وأبحاث <i class="fa-solid fa-angle-down"></i></a>
            <a href="#" class="sub-btn">كتب ورسائل جامعية <i class="fa-solid fa-angle-down"></i></a>
            <a href="#" class="sub-btn">مرئيات <i class="fa-solid fa-angle-down"></i></a>
          </div>
        </div>

        <!-- Axis 2 -->
        <div class="axis-card">
          <div>
            <div class="axis-title">المحور الثاني: مِفْتَاحُ النَّصِّ القُرْآنِيِّ</div>
            <div class="axis-desc">
              1️⃣ إعجاز معرفي في علوم التنزيل وأوجه الإعجاز المعماري للنص القرآني الكريم.<br>
              2️⃣ صياغة حجاج فكري رصين لإبطال المطاعن النصية والتاريخية أمام الفكر التفكيكي الحداثي.
            </div>
          </div>
          <div class="sub-sections">
            <a href="#" class="sub-btn">مقالات وأبحاث <i class="fa-solid fa-angle-down"></i></a>
            <a href="#" class="sub-btn">كتب ورسائل جامعية <i class="fa-solid fa-angle-down"></i></a>
            <a href="#" class="sub-btn">مرئيات <i class="fa-solid fa-angle-down"></i></a>
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="quran-verse">
      ﴿ سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ وَفِي أَنفُسِهِمْ حَتَّىٰ يَتَبَيَّنَ لَهُمْ أَنَّهُ الْحَقُّ ﴾
      <div style="font-size: 1rem; color: var(--text-dim); margin-top: 5px;">= سورة فصلت: ٥٣</div>
    </div>

    <div class="social-links">
      <a href="#" class="social-btn btn-yt"><i class="fa-brands fa-youtube"></i> YouTube</a>
      <a href="#" class="social-btn btn-tt"><i class="fa-brands fa-tiktok"></i> TikTok</a>
      <a href="#" class="social-btn btn-fb"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
      <a href="#" class="social-btn btn-ig"><i class="fa-brands fa-instagram"></i> Instagram</a>
    </div>

    <div class="contact-info">
      <span><i class="fa-solid fa-envelope"></i> profremadnaabdelaziz@gmail.com</span>
      <span><i class="fa-solid fa-phone"></i> tél: 0656 27 91 94</span>
    </div>

    <div class="copyright">
      مِعْمَارُ الوَحْيِ – MIMAR AL-WAHY | الأُسْتَاذُ رَمَاضْنَة عبد العزيز – دِرَاسَاتٌ إِسْلَامِيَّةٌ عُلْيَا © 2026
    </div>
  </footer>

</body>
</html>
